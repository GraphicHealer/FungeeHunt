name: Typecheck

# Runs on PRs (result posted as a PR comment) and on pushes to dev as an
# early signal. Pushes to main are covered by the gating jobs in docker.yml.
on:
  pull_request:
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docker-compose.yml'
      - '*.xml'
      - 'nginx/**'
      - 'type-logs.txt'
      - 'LICENSE*'

permissions:
  contents: read
  pull-requests: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck server
        id: server
        continue-on-error: true
        working-directory: packages/server
        run: npx tsc --noEmit

      - name: Typecheck web
        id: web
        continue-on-error: true
        working-directory: packages/web
        run: npm run check

      - name: Comment results on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- fungeehunt-typecheck -->';
            const server = '${{ steps.server.outcome }}';
            const web = '${{ steps.web.outcome }}';
            const icon = (r) => (r === 'success' ? '✅' : '❌');
            const body = [
              marker,
              '### Typecheck results',
              '',
              `| Check | Result |`,
              `| --- | --- |`,
              `| Server (\`tsc --noEmit\`) | ${icon(server)} ${server} |`,
              `| Web (\`svelte-check\`) | ${icon(web)} ${web} |`,
              '',
              '_Web check is advisory only; the server check is required._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Fail the job only on the server check; web is advisory.
      - name: Enforce server typecheck
        if: steps.server.outcome != 'success'
        run: exit 1
