services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: fungeehunt
      POSTGRES_USER: fungeehunt
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fungeehunt"]

  fungee-hunt:
    # image: ghcr.io/graphichealer/fungeehunt:latest
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GM_PASSPHRASE: changeme
      SESSION_SECRET: changeme
      DATABASE_URL: postgresql://fungeehunt:changeme@postgres:5432/fungeehunt
      WEB_UI: 3000
      UPLOAD_DIR: /data/uploads
      LOG_LEVEL: debug
      TZ: America/New_York
    volumes:
      - uploads_data:/data/uploads

volumes:
  postgres_data:
  uploads_data:
